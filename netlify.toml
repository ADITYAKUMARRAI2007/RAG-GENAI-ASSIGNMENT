# Netlify + @netlify/plugin-nextjs
#
# If the dashboard sets Publish directory to the repo root (logs show publishOrigin: ui and
# publish: /opt/build/repo), the plugin errors: publish cannot match the site base directory.
# This file sets publish = ".next" so it overrides the UI (Netlify merges config: toml wins).
# You can instead clear "Publish directory" in the dashboard and remove the line below.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-nextjs"
